spring:
  application:
    name: tenant-loyalty-service
 
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
 
  # Always import local-only secrets if present.
  # This avoids requiring manual env var exports for SMTP/JWT in dev.
  # File is optional and should remain git-ignored.
  config:
    import: optional:file:./application-secrets.yml
 
  threads:
    virtual:
      enabled: true
 
  # JPA schema: no Flyway. Hibernate syncs entity changes on startup (dev default: update).
  # For production-like DBs, set JPA_DDL_AUTO=validate and apply SQL under backend/scripts/sql/ manually.
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
  # Datasource — values come from environment variables
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/loyaltyos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionCollation=utf8mb4_unicode_ci}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Ms@mysql811}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: onboarding-pool
 
  data:
    # Local Redis only (not Docker). Start Redis on this host:port before register/login.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
 
  # --- Kafka (commented out until we scale / need downstream consumers) ---
  # kafka:
  #   bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  #   producer:
  #     key-serializer: org.apache.kafka.common.serialization.StringSerializer
  #     value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  #     acks: all
  #     retries: 3
  #     properties:
  #       enable.idempotence: "true"
  #       max.in.flight.requests.per.connection: "5"
 
  # Security — disable default user for now, we configure this properly later
  security:
    user:
      name: disable
      password: disable
 
  # Mail (host/port defaults; username/password can come from application-secrets.yml)
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
 
server:
  port: 8081
 
loyalty:
  rules:
    cache-enabled: ${LOYALTY_RULES_CACHE_ENABLED:true}
    cache-ttl-seconds: ${LOYALTY_RULES_CACHE_TTL_SECONDS:300}
    max-condition-depth: ${LOYALTY_RULES_MAX_CONDITION_DEPTH:32}
    evaluation-timeout-ms: ${LOYALTY_RULES_EVAL_TIMEOUT_MS:5000}
    caps-redis-enabled: ${LOYALTY_RULES_CAPS_REDIS_ENABLED:false}
  rewards:
    issuance-audit-enabled: ${LOYALTY_REWARDS_ISSUANCE_AUDIT_ENABLED:true}
    issuance-audit-strict: ${LOYALTY_REWARDS_ISSUANCE_AUDIT_STRICT:false}
    failure-audit-enabled: ${LOYALTY_REWARDS_FAILURE_AUDIT_ENABLED:true}
    expiry-job-enabled: ${LOYALTY_REWARDS_EXPIRY_JOB_ENABLED:true}
    expiry-batch-limit: ${LOYALTY_REWARDS_EXPIRY_BATCH_LIMIT:500}
    expiry-fixed-delay-ms: ${LOYALTY_REWARDS_EXPIRY_FIXED_DELAY_MS:3600000}
    reconciliation-job-enabled: ${LOYALTY_REWARDS_RECONCILIATION_JOB_ENABLED:false}
    reconciliation-auto-fix-enabled: ${LOYALTY_REWARDS_RECONCILIATION_AUTO_FIX_ENABLED:false}
    reconciliation-customer-batch-limit: ${LOYALTY_REWARDS_RECONCILIATION_CUSTOMER_BATCH_LIMIT:200}
    reconciliation-fixed-delay-ms: ${LOYALTY_REWARDS_RECONCILIATION_FIXED_DELAY_MS:3600000}
    default-credit-expiry-months: ${LOYALTY_REWARDS_DEFAULT_CREDIT_EXPIRY_MONTHS:24}
  campaigns:
    enabled: ${LOYALTY_CAMPAIGNS_ENABLED:true}
    rule-gated-only: ${LOYALTY_CAMPAIGNS_RULE_GATED_ONLY:true}
    default-alert-threshold-pct: ${LOYALTY_CAMPAIGNS_DEFAULT_ALERT_THRESHOLD_PCT:80}
    resolution-log-enabled: ${LOYALTY_CAMPAIGNS_RESOLUTION_LOG_ENABLED:true}
    budget-alert-webhook-enabled: ${LOYALTY_CAMPAIGNS_BUDGET_ALERT_WEBHOOK_ENABLED:true}
    budget-alert-kafka-topic: ${LOYALTY_CAMPAIGNS_BUDGET_ALERT_KAFKA_TOPIC:platform.campaign.alerts}
    exhausted-job-enabled: ${LOYALTY_CAMPAIGNS_EXHAUSTED_JOB_ENABLED:true}
    exhausted-fixed-delay-ms: ${LOYALTY_CAMPAIGNS_EXHAUSTED_FIXED_DELAY_MS:300000}
    expired-job-enabled: ${LOYALTY_CAMPAIGNS_EXPIRED_JOB_ENABLED:true}
    expired-fixed-delay-ms: ${LOYALTY_CAMPAIGNS_EXPIRED_FIXED_DELAY_MS:300000}
    target-customer-upload:
      max-file-size-mb: ${LOYALTY_CAMPAIGNS_TARGET_MAX_FILE_SIZE_MB:10}
      max-rows: ${LOYALTY_CAMPAIGNS_TARGET_MAX_ROWS:50000}
      max-customer-id-length: ${LOYALTY_CAMPAIGNS_TARGET_MAX_CUSTOMER_ID_LENGTH:128}
      min-customer-id-length: ${LOYALTY_CAMPAIGNS_TARGET_MIN_CUSTOMER_ID_LENGTH:1}
loyaltyos:
  voucher:
    enabled: ${LOYALTYOS_VOUCHER_ENABLED:true}
    max-file-size-mb: ${LOYALTYOS_VOUCHER_MAX_FILE_SIZE_MB:50}
    max-rows: ${LOYALTYOS_VOUCHER_MAX_ROWS:100000}
    low-stock-threshold: ${LOYALTYOS_VOUCHER_LOW_STOCK_THRESHOLD:100}
    expiry-job-enabled: ${LOYALTYOS_VOUCHER_EXPIRY_JOB_ENABLED:true}
    expiry-cron: ${LOYALTYOS_VOUCHER_EXPIRY_CRON:0 0 2 * * *}
    auto-issue-from-rules:
      enabled: ${LOYALTYOS_VOUCHER_AUTO_ISSUE_FROM_RULES_ENABLED:true}
  coupon:
    enabled: ${LOYALTYOS_COUPON_ENABLED:true}
    expiry-job-enabled: ${LOYALTYOS_COUPON_EXPIRY_JOB_ENABLED:true}
    expiry-cron: ${LOYALTYOS_COUPON_EXPIRY_CRON:0 15 2 * * *}
  integration:
    encryption-key: ${INTEGRATION_ENCRYPTION_KEY:}
    rate-limit:
      redis-enabled: ${INTEGRATION_RATE_LIMIT_REDIS:true}
      default-requests-per-hour: 1000
    idempotency:
      cache-ttl-hours: 24
 
app:
  onboarding:
    # Unverified registrations expire after this many hours.
    # Used both at request-time and by the scheduled cleanup job.
    pending-expiry-hours: ${APP_ONBOARDING_PENDING_EXPIRY_HOURS:24}
    cleanup:
      fixed-delay-ms: ${APP_ONBOARDING_CLEANUP_FIXED_DELAY_MS:3600000}
 
# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
 
# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html